name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Checks, tests and build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Repo tooling tests
        run: node --test "scripts/**/*.test.mjs"

      - name: Compatibility invariants
        run: node scripts/check-invariants.mjs

      - name: Secret scan
        run: node scripts/check-secrets.mjs --all

      - name: Docs (generated sections, links)
        run: |
          node scripts/docs/generate.mjs --check
          node scripts/docs/links.mjs

      - name: Docs freshness
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/docs/freshness.mjs --base "$BASE"
          else
            echo "No usable base commit (new branch or rewritten history); validating the docs map only."
            node scripts/docs/freshness.mjs
          fi

      - name: Typecheck, lint, test
        working-directory: app
        run: pnpm check

      - name: Frontend build
        working-directory: app
        run: pnpm build

      - name: Dependency audit (npm)
        working-directory: app
        run: pnpm audit --audit-level high

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri

      - name: Rust format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit

      - name: Dependency audit (crates)
        working-directory: app/src-tauri
        run: cargo audit

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
