[package]
name = "student-invoice-tauri"
version = "1.1.1"
description = "Student Invoice"
authors = ["isaac"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "student_invoice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the Google OAuth client file at build time (see build.rs).
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Native save/open dialogs, used only from Rust (export/import).
tauri-plugin-dialog = "2"
# A second launch focuses the running window instead of starting another copy
# (release builds; see src/lib.rs).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

# Google sign-in and Gmail. oauth2 is given the app's own reqwest client, so
# every request uses one TLS stack that trusts the Windows certificate store.
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
url = "2.5"
base64 = "0.22"
semver = "1"

# Refresh token storage in Windows Credential Manager.
keyring-core = "1"

# Development only: lets the Tauri MCP server inspect and drive the app.
# Enabled by the non-default `mcp-bridge` feature (see docs/development.md).
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

# Smaller, faster release builds (docs/performance.md). Panics keep the
# default "unwind" so a failure in a background task can't take down the app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
