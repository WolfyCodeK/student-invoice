<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Invoice</title>
    <script>
      // Apply the saved appearance before the first paint, so there's no
      // flash of the wrong colours (docs/ui.md "Appearance").
      try {
        var root = document.documentElement;
        var mode = localStorage.getItem("student-invoice-theme");
        var settings = (JSON.parse(localStorage.getItem("student-invoice-store") || "{}").state || {}).settings || {};
        root.dataset.mode = mode === "dark" || mode === "light" ? mode : settings.theme === "dark" ? "dark" : "light";
        root.dataset.scheme = settings.colourScheme === "navy-amber" ? "navy-amber" : "student-invoice";
        root.dataset.corners = settings.corners === "rounded" ? "rounded" : "square";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
